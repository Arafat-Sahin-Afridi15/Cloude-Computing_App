<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Cloud Service - Arafat Sahin Afridi</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
  }
  header h1 {
    margin: 0 0 8px 0;
    font-size: 1.8rem;
  }
  header p {
    margin: 2px 0;
    color: var(--muted);
    font-size: 1rem;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card h2 {
    margin-top: 0;
    font-size: 1.2rem;
    color: var(--accent);
  }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    resize: vertical;
  }
  button {
    margin-top: 14px;
    padding: 10px 22px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  #response {
    margin-top: 18px;
    padding: 14px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid #334155;
    min-height: 40px;
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  footer {
    margin-top: 30px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

  <header>
    <h1>AI Cloud Service</h1>
    <p><strong>Name:</strong> Arafat Sahin Afridi</p>
    <p><strong>Student ID:</strong> 2026512801</p>
  </header>

  <div class="card">
    <h2>Ask the AI</h2>
    <p style="color: var(--muted); font-size: 0.9rem;">
      Type a question or prompt below and get an AI-generated response.
    </p>
    <textarea id="prompt" placeholder="e.g. Give me 3 tips for staying focused while studying"></textarea>
    <br />
    <button id="askBtn" onclick="askAI()">Ask AI</button>
    <div id="response">Response will appear here...</div>
  </div>

  <footer>Built with Node.js + Express, deployed on Render</footer>

  <script>
    async function askAI() {
      const promptEl = document.getElementById('prompt');
      const responseEl = document.getElementById('response');
      const btn = document.getElementById('askBtn');
      const prompt = promptEl.value.trim();

      if (!prompt) {
        responseEl.textContent = "Please type something first.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Thinking...";
      responseEl.textContent = "Loading...";

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();

        if (!res.ok) {
          responseEl.textContent = "Error: " + (data.error || "unknown error");
        } else {
          responseEl.textContent = data.reply;
        }
      } catch (err) {
        responseEl.textContent = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ask AI";
      }
    }
  </script>

</body>
</html>
